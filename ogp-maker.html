<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>OGP Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #cbd5e1; /* 作業用の背景色 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* OGPの黄金比サイズ 1200x630 */
    .ogp-canvas {
      width: 1200px;
      height: 630px;
      background: radial-gradient(circle at 100% 0%, #1e293b 0%, #0f172a 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 100px;
      box-sizing: border-box;
    }

    /* 装飾グラフィック（カラーパレットの表現） */
    .color-blocks {
      position: absolute;
      right: -50px;
      top: 50%;
      transform: translateY(-50%) rotate(-15deg);
      display: flex;
      gap: 20px;
    }
    .block {
      width: 140px;
      height: 600px;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .block-1 { background: #3B72B1; transform: translateY(-40px); }
    .block-2 { background: #da6272; transform: translateY(40px); }
    .block-3 { background: #f8fafc; transform: translateY(-20px); }

    /* テキストエリア */
    .content {
      position: relative;
      z-index: 10;
      max-width: 700px;
    }
    .tag {
      display: inline-block;
      background: rgba(59, 114, 177, 0.2);
      color: #60a5fa;
      padding: 8px 16px;
      border-radius: 100px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      border: 1px solid rgba(59, 114, 177, 0.4);
    }
    .title {
      font-family: 'Montserrat', sans-serif;
      font-size: 96px;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 16px 0;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #94a3b8;
      margin: 0 0 48px 0;
      line-height: 1.5;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #0f172a;
      font-size: 24px;
    }
    .brand-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  
  <div class="ogp-canvas">
    <!-- 装飾のカラーブロック -->
    <div class="color-blocks">
      <div class="block block-1"></div>
      <div class="block block-2"></div>
      <div class="block block-3"></div>
    </div>

    <!-- テキストコンテンツ -->
    <div class="content">
      <div class="tag">UI DESIGN TOOL</div>
      <h1 class="title">Color<br>Concept</h1>
      <p class="subtitle">ロジカルな配色理論で導き出す<br>UIカラーパレットジェネレーター</p>
      
      <div class="brand">
        <div class="brand-logo">A</div>
        <div class="brand-name">Ashiras, inc.</div>
      </div>
    </div>
  </div>

</body>
</html>
